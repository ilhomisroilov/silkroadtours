# Runs on every push: type check, unit tests (incl. AI guard), schema check, production build,
# then starts the built app with a fresh SQLite database and runs the smoke test,
# and finally checks that the Docker image builds. It never deploys and needs no secrets.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Database schema matches migrations
        run: python3 scripts/check-schema-parity.py
      - name: Build
        run: npm run build
      - name: Start the built app on a fresh database
        env:
          DATABASE_URL: file:./data/ci.db
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          ADMIN_SECRET: ci-only-admin-secret-0123456789
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          SITE_URL: http://localhost:3000
          AI_PROVIDER: mock
        run: |
          npm run db:migrate && npm run db:seed
          npm start > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
      - name: Smoke test
        run: npm run test:smoke
      - name: App log
        if: failure()
        run: cat app.log || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t silkroadtours:ci .
