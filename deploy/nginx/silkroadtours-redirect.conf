# Former domain __OLD__ → https://__DOMAIN__ (301, path and query kept). Written by setup-server.sh (OLD_DOMAINS)
# to /etc/nginx/sites-available/<instance>-redirects.conf; the TLS block is dropped when __OLD__ has no
# certificate. ACME challenges stay answered so the old certificate keeps renewing.
server {
    listen 80;
    listen [::]:80;
    server_name __OLD__ www.__OLD__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
# BEGIN TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __OLD__ www.__OLD__;
    ssl_certificate     /etc/letsencrypt/live/__OLD__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__OLD__/privkey.pem;
    include /etc/nginx/snippets/silkroad-ssl.conf;
    return 301 https://__DOMAIN__$request_uri;
}
# END TLS
