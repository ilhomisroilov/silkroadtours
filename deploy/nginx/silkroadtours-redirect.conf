# Former domain __OLD__ → https://__DOMAIN__ (301, path and query kept).
# setup-server.sh writes one copy per OLD_DOMAINS entry to /etc/nginx/sites-available/silkroadtours-redirects.conf;
# the TLS block is dropped when there is no certificate for __OLD__. ACME challenges stay answered so the old
# certificate keeps renewing for as long as the redirect is needed.
server {
    listen 80;
    listen [::]:80;
    server_name __OLD__ www.__OLD__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
# BEGIN TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __OLD__ www.__OLD__;
    ssl_certificate     /etc/letsencrypt/live/__OLD__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__OLD__/privkey.pem;
    include /etc/nginx/snippets/silkroad-ssl.conf;
    return 301 https://__DOMAIN__$request_uri;
}
# END TLS
