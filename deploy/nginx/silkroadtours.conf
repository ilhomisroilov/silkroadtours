# nginx site for silkroadtours.uz → Docker app on 127.0.0.1:3000 (setup-server.sh rewrites the port to APP_PORT)
# Installed by deploy/setup-server.sh to /etc/nginx/sites-available/silkroadtours.conf.
# Certificates come from Let's Encrypt (certbot --webroot, renewed automatically by certbot.timer).

limit_req_zone $binary_remote_addr zone=srt_api:10m rate=10r/s;

upstream silkroad_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP: ACME challenges, everything else → https://silkroadtours.uz
server {
    listen 80;
    listen [::]:80;
    server_name silkroadtours.uz www.silkroadtours.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://silkroadtours.uz$request_uri;
    }
}

# HTTPS www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.silkroadtours.uz;

    ssl_certificate     /etc/letsencrypt/live/silkroadtours.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkroadtours.uz/privkey.pem;
    include /etc/nginx/snippets/silkroad-ssl.conf;

    return 301 https://silkroadtours.uz$request_uri;
}

# HTTPS apex → app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name silkroadtours.uz;

    ssl_certificate     /etc/letsencrypt/live/silkroadtours.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silkroadtours.uz/privkey.pem;
    include /etc/nginx/snippets/silkroad-ssl.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    # Hashed build assets and photos: cache hard.
    location /_next/static/ {
        proxy_pass http://silkroad_app;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /images/ {
        proxy_pass http://silkroad_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # AI and form endpoints: per-IP burst limit in front of the app's own limits.
    location /api/ {
        limit_req zone=srt_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://silkroad_app;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://silkroad_app;
    }
}
